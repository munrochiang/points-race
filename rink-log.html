<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121416">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%233d4652'/%3E%3C/svg%3E">
<title>場邊壓秒</title>
<style>
  :root {
    --bg: #121416;
    --surface: #1b1e22;
    --card: #262a30;
    --accent: #3d4652;
    --text: #e6e4df;
    --text-dim: #8a8f96;
    --success: #4f7f6a;
    --warn: #b89a5a;
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; overscroll-behavior: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 12px;
    padding-top: calc(8px + env(safe-area-inset-top));
    background: var(--surface);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .header h1 { font-size: 16px; font-weight: 700; white-space: nowrap; }
  .clock { font-variant-numeric: tabular-nums; color: var(--text-dim); font-size: 13px; }


  /* ── Main ── */
  .main { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 8px 12px; }

  .setbtn { background: var(--card); padding: 12px; font-size: 18px; display: flex; align-items: baseline; justify-content: center; gap: 8px; }
  .setbtn small { color: var(--text-dim); font-weight: 400; font-size: 13px; }

  .btn {
    border: none; border-radius: 10px; font-weight: 700; cursor: pointer;
    font-family: inherit; color: var(--text);
    transition: transform 0.08s, filter 0.08s;
  }
  .btn:active { transform: scale(0.94); filter: brightness(1.3); }
  .btn-outline { background: transparent; border: 1.5px solid rgba(255,255,255,0.25); padding: 8px 12px; font-size: 14px; }
  .btn-small { background: var(--card); padding: 8px 12px; font-size: 14px; }

  .lap { display: flex; gap: 8px; min-height: 34vh; }
  .half {
    flex: 1; background: var(--accent); border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  .half .big { font-size: 46px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .half .label { font-size: 20px; font-weight: 800; letter-spacing: 3px; }
  .half .sub { font-size: 13px; opacity: 0.85; font-variant-numeric: tabular-nums; text-align: center; padding: 0 6px; }
  .half.flash { filter: brightness(1.5); }
  .half.running { background: #35584b; }
  .half.off { background: #22262b; color: var(--text-dim); box-shadow: none; }
  .lapbtn { background: #333a44; }
  .chips h3 { width: 100%; font-size: 13px; font-weight: 400; color: var(--text-dim); margin-top: 4px; }
  .chips .chip.untimed { background: #2c3139; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .ev {
    background: var(--card);
    padding: 20px 4px;
    font-size: 22px;
    border-radius: 12px;
  }
  .ev.bad { background: #4a3034; }
  .ev.warn { background: #45403a; }
  .ev.good { background: #2f4a44; }
  .ev.hit { filter: brightness(1.8); }
  .ev.wide { grid-column: 1 / -1; padding: 14px 4px; }

  .tools { display: flex; gap: 8px; }
  .tools .btn { flex: 1; }

  /* ── Log ── */
  .log { flex: 1; min-height: 120px; max-height: 32vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
         background: var(--surface); border-radius: var(--radius); padding: 4px 0; }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid rgba(255,255,255,0.05);
         font-size: 14px; font-variant-numeric: tabular-nums; }
  .row .t { color: var(--text-dim); width: 64px; }
  .row .w { flex: 1; }
  .row .w b { color: var(--warn); }
  .row .del { color: var(--text-dim); padding: 2px 8px; font-size: 16px; background: none; border: none; }
  .row.set { background: rgba(255,255,255,0.05); font-weight: 700; }

  /* ── Sheet ── */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; z-index: 20; }
  .sheet-bg.open { display: flex; align-items: flex-end; }
  .sheet { background: var(--surface); width: 100%; border-radius: 16px 16px 0 0; padding: 16px;
           padding-bottom: calc(16px + env(safe-area-inset-bottom)); max-height: 85vh; overflow-y: auto; }
  .sheet h2 { font-size: 16px; margin-bottom: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip { background: var(--card); padding: 12px 16px; font-size: 17px; border-radius: 10px; }
  .field { display: flex; align-items: center; gap: 10px; margin: 10px 0; font-size: 15px; }
  .field label { width: 44px; }
  .field input[type=range] { flex: 1; }
  .field input[type=text], .field textarea {
    flex: 1; padding: 8px; border-radius: 8px; border: 1.5px solid rgba(255,255,255,0.2);
    background: transparent; color: var(--text); font-size: 15px; font-family: inherit;
  }
  .field .val { width: 28px; text-align: right; font-weight: 700; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .stack .btn { padding: 14px; font-size: 16px; }
  .btn-primary { background: var(--accent); }
  .btn-danger { background: #5a3338; }
  .hint { color: var(--text-dim); font-size: 13px; margin-top: 8px; line-height: 1.5; }
  textarea.out { width: 100%; height: 120px; font-family: monospace; font-size: 11px; margin: 8px 0;
                 background: #0e1012; color: var(--text); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 6px; }

  .toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); background: #3a4a44; color: var(--text);
           padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 14px; opacity: 0; transition: opacity 0.2s; z-index: 30; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <h1>場邊壓秒</h1>
  <span class="clock" id="clock">--:--:--</span>
</div>

<div class="main">
  <button class="btn setbtn" id="setBtn"><span id="setName">未知距離</span><small id="setState">預設</small></button>

  <div class="lap">
    <button class="btn half" id="startBtn">
      <div class="label" id="startLabel">開始</div>
      <div class="big" id="totalClock">0.0</div>
      <div class="sub" id="startInfo">總時</div>
    </button>
    <button class="btn half lapbtn" id="lapBtn">
      <div class="label">過線</div>
      <div class="big" id="lapClock">0.0</div>
      <div class="sub" id="lapInfo">第 0 圈</div>
    </button>
  </div>

  <div class="grid">
    <button class="btn ev" data-ev="帶">帶</button>
    <button class="btn ev" data-ev="跟">跟</button>
    <button class="btn ev good" data-ev="開放超越">開放超越</button>
    <button class="btn ev warn" data-ev="掉隊">掉隊</button>
    <button class="btn ev bad wide" id="abn">異常</button>
  </div>

  <div class="tools">
    <button class="btn btn-outline" id="undo">↶ 復原</button>
    <button class="btn btn-outline" id="note">＋備註</button>
    <button class="btn btn-outline" id="finish">收操</button>
    <button class="btn btn-outline" id="export">匯出</button>
  </div>

  <div class="log" id="log"></div>
</div>

<!-- 新組 -->
<div class="sheet-bg" id="setSheet">
  <div class="sheet">
    <h2>下一組是什麼</h2>
    <div class="chips" id="setChips"></div>
    <div class="field"><label>其他</label><input type="text" id="setCustom" placeholder="自訂名稱"><button class="btn btn-small" id="setCustomOk">選這個</button></div>
    <div class="field"><label></label><label style="width:auto"><input type="checkbox" id="setCustomUntimed"> 自訂組不計時，只記起訖</label></div>
    <button class="btn btn-outline" style="width:100%" data-close>取消</button>
  </div>
</div>

<!-- 異常 -->
<div class="sheet-bg" id="abnSheet">
  <div class="sheet">
    <h2>異常：是哪一種（時間已記在按下的瞬間）</h2>
    <div class="chips" id="abnChips">
      <button class="btn chip" data-n="喘">喘</button>
      <button class="btn chip" data-n="摔">摔</button>
      <button class="btn chip" data-n="痛">痛</button>
      <button class="btn chip" data-n="不舒服">不舒服</button>
      <button class="btn chip" data-n="停下">停下</button>
    </div>
    <div class="field"><label>其他</label><input type="text" id="abnCustom" placeholder="自己打"><button class="btn btn-small" id="abnCustomOk">記下</button></div>
    <button class="btn btn-outline" style="width:100%" data-close>先關掉，稍後補備註</button>
  </div>
</div>

<!-- 備註 -->
<div class="sheet-bg" id="noteSheet">
  <div class="sheet">
    <h2>備註（時間記在打開這個視窗的瞬間）</h2>
    <div class="field"><textarea id="noteText" rows="3" placeholder="例：500 公尺 4 人第 3，起跑領先後被超"></textarea></div>
    <div class="stack">
      <button class="btn btn-primary" id="noteOk">記下</button>
      <button class="btn btn-outline" data-close>取消</button>
    </div>
  </div>
</div>

<!-- 收操 -->
<div class="sheet-bg" id="finishSheet">
  <div class="sheet">
    <h2>收操：問他三件事</h2>
    <div class="field"><label>累</label><input type="range" id="tired" min="1" max="10" value="6"><span class="val" id="tiredVal">6</span></div>
    <div class="field"><label>痛</label><input type="text" id="pain" placeholder="無／左膝內側…"></div>
    <div class="field"><label>喘</label><input type="text" id="wheeze" placeholder="無／第幾組有…"></div>
    <div class="stack">
      <button class="btn btn-primary" id="finishOk">記下</button>
      <button class="btn btn-outline" data-close>取消</button>
    </div>
  </div>
</div>

<!-- 匯出 -->
<div class="sheet-bg" id="exportSheet">
  <div class="sheet">
    <h2>匯出</h2>
    <div class="field"><label>選手</label><input type="text" id="athlete" placeholder="毛／爪"></div>
    <div class="stack">
      <button class="btn btn-primary" id="shareBtn">分享 JSON 檔</button>
      <button class="btn btn-small" id="copyBtn">複製 JSON 文字</button>
      <button class="btn btn-small" id="csvBtn">下載 CSV</button>
      <button class="btn btn-danger" id="clearBtn">清除全部紀錄</button>
      <button class="btn btn-outline" data-close>關閉</button>
    </div>
    <textarea class="out" id="outText" readonly></textarea>
    <div class="hint">
      每筆都是手機的絕對時間（epoch ms），兩支手機各記一個孩子、各自匯出，合併時直接用時間對齊。
      上課前請確認兩支手機時間都是自動校時。
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const KEY = 'rink-log:v1';
  // 距離組：name → 預期過線次數（500+D 從半圈處起跑，過線 0.5/1.5/2.5 共 3 次）
  const DIST = { '200': 1, '500+D': 3, '1000': 5, '2000': 10, '3000': 15, '4000': 20, '5000': 25, '6000': 30, '10000': 50 };
  // 計時組：壓每次過線；不計時組：只記開始與結束時間
  // 未知距離：壓每次過線但不自動結束，用「結束組」收尾
  const TIMED_SETS = ['未知距離', ...Object.keys(DIST)];
  const UNTIMED_SETS = ['大圈跑步', '熱身溜冰', '布鞋基本動作', '溜冰鞋基本動作', '起跑', '變位練習', '後超越', '接力', '緩和'];
  const $ = id => document.getElementById(id);

  // ── state ──
  // events: {t: epoch ms, type, set, lap?, text?}
  // type: set | start | set_end | lap | <event name> | note | finish
  // set 與 start 同時寫入（按「開始」那一刻）；pending = 下一組要用的組別，未選就是未知距離
  const DEFAULT_SET = { text: '未知距離', timed: true };
  let state = load() || { athlete: '', pending: null, events: [] };
  state.pending = state.pending || null;

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  // ── helpers ──
  const pad = n => String(n).padStart(2, '0');
  const hms = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
  const sec = ms => (ms / 1000).toFixed(1);
  const allEvents = () => state.events;

  // the open set (last set without a later set_end)
  const isUntimed = s => Boolean(s && s.timed === false);
  function currentSet() {
    const evs = allEvents();
    for (let i = evs.length - 1; i >= 0; i--) {
      if (evs[i].type === 'set_end') return null;
      if (evs[i].type === 'set') return evs[i];
    }
    return null;
  }
  // start event of the current set, or null while still preparing
  function currentStart() {
    const s = currentSet();
    if (!s) return null;
    return allEvents().find(e => e.type === 'start' && e.t >= s.t) || null;
  }
  // laps in the current set
  function currentLaps() {
    const st = currentStart();
    if (!st) return [];
    return allEvents().filter(e => e.type === 'lap' && e.t >= st.t);
  }

  function vib(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

  let toastTimer;
  function toast(msg) {
    const el = $('toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1200);
  }

  function push(ev) {
    ev.t = ev.t || Date.now();
    const s = currentSet();
    if (s && ev.type !== 'set') ev.set = s.text;
    state.events.push(ev);
    save(); render();
  }

  // ── render ──
  function render() {
    const s = currentSet();
    const st = currentStart();
    const laps = currentLaps();
    const running = Boolean(s && st);
    if (running) {
      $('setName').textContent = s.text;
      $('setState').textContent = `${hms(st.t)} 開始${isUntimed(s) ? '・不計時' : ''}`;
    } else {
      const p = state.pending || DEFAULT_SET;
      $('setName').textContent = p.text;
      $('setState').textContent = state.pending ? (p.timed ? '下一組' : '下一組・不計時') : '預設・點此選組';
    }
    $('startBtn').classList.toggle('running', running);
    $('startLabel').textContent = running ? '結束' : '開始';
    $('startInfo').textContent = running ? '總時' : '按下即起算';
    const lapOn = running && !isUntimed(s);
    $('lapBtn').classList.toggle('off', !lapOn);
    if (lapOn) {
      let lastSplit = '—';
      if (laps.length >= 2) lastSplit = sec(laps[laps.length - 1].t - laps[laps.length - 2].t) + 's';
      else if (laps.length === 1) lastSplit = sec(laps[0].t - st.t) + 's';
      const need = DIST[s.text];
      $('lapInfo').textContent = `第 ${laps.length}${need ? '／' + need : ''} 圈　上圈 ${lastSplit}`;
    } else {
      $('lapInfo').textContent = running ? '不計時' : '';
    }

    // log, newest first
    const log = $('log');
    const rows = state.events.slice(-80).reverse().map((e, idx) => {
      const i = state.events.length - 1 - idx;
      let w = '';
      if (e.type === 'set') w = `選組 ${e.text}${isUntimed(e) ? '（不計時）' : ''}`;
      else if (e.type === 'start') w = `▶ 開始`;
      else if (e.type === 'set_end') w = `■ 結束`;
      else if (e.type === 'lap') {
        // split vs previous lap in the same set
        let prev = null;
        for (let j = i - 1; j >= 0; j--) {
          const p = state.events[j];
          if (p.type === 'lap' || p.type === 'start') { prev = p; break; }
          if (p.type === 'set') break;
        }
        w = `圈 ${e.lap}` + (prev ? `　<b>${sec(e.t - prev.t)}</b>` : '');
      }
      else if (e.type === 'note') w = `📝 ${e.text}`;
      else if (e.type === '異常') w = `<b>⚠ 異常</b>${e.text ? '：' + e.text : ''}`;
      else if (e.type === 'finish') w = `收操 累${e.tired} 痛:${e.pain || '無'} 喘:${e.wheeze || '無'}`;
      else w = `<b>${e.type}</b>`;
      return `<div class="row ${e.type === 'set' ? 'set' : ''}">
        <span class="t">${hms(e.t)}</span>
        <span class="w">${w}</span><button class="del" data-i="${i}">✕</button></div>`;
    });
    log.innerHTML = rows.join('') || '<div class="row" style="color:var(--text-dim)">還沒有紀錄</div>';
  }

  // live clocks
  function tick() {
    $('clock').textContent = hms(Date.now());
    const laps = currentLaps(); const st = currentStart(); const s = currentSet();
    $('totalClock').textContent = st ? sec(Date.now() - st.t) : '0.0';
    const from = laps.length ? laps[laps.length - 1].t : (st && !isUntimed(s) ? st.t : null);
    $('lapClock').textContent = from ? sec(Date.now() - from) : '0.0';
  }
  setInterval(tick, 100);

  // ── actions ──
  const flash = el => { el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 120); };
  let lastPressAt = 0;
  const debounced = () => { const now = Date.now(); if (now - lastPressAt < 400) return 0; lastPressAt = now; return now; };

  // 左半：開始／結束
  $('startBtn').addEventListener('pointerdown', e => {
    e.preventDefault();
    const now = debounced(); if (!now) return;
    const s = currentSet(); const st = currentStart();
    if (!s || !st) {
      const p = state.pending || DEFAULT_SET;
      push(p.timed ? { t: now, type: 'set', text: p.text } : { t: now, type: 'set', text: p.text, timed: false });
      push({ t: now, type: 'start' });
      state.pending = null; save(); render();
      vib(60); toast(`${p.text} ▶ 開始`);
    } else {
      push({ t: now, type: 'set_end' });
      vib([30, 60, 30]); toast(`${s.text} 結束 ${sec(now - st.t)}s`);
    }
    flash($('startBtn'));
  });

  // 右半：過線
  $('lapBtn').addEventListener('pointerdown', e => {
    e.preventDefault();
    const now = debounced(); if (!now) return;
    const s = currentSet(); const st = currentStart();
    if (!s || !st) { toast('先按「開始」'); return; }
    if (isUntimed(s)) { toast('這組不計時'); return; }
    const n = currentLaps().length + 1;
    push({ t: now, type: 'lap', lap: n });
    vib(30);
    if (DIST[s.text] && n >= DIST[s.text]) {
      push({ t: now, type: 'set_end' });
      toast(`${s.text} 完成 ${sec(now - st.t)}s`); vib([30, 60, 30]);
    }
    flash($('lapBtn'));
  });

  document.querySelectorAll('.ev[data-ev]').forEach(b => b.addEventListener('pointerdown', e => {
    e.preventDefault();
    push({ type: b.dataset.ev });
    vib(15);
    b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 150);
    toast(b.dataset.ev);
  }));

  $('undo').addEventListener('click', () => {
    if (!state.events.length) return;
    const e = state.events.pop(); save(); render(); toast(`已復原：${e.type === 'lap' ? '圈 ' + e.lap : (e.text || e.type)}`);
  });

  $('log').addEventListener('click', e => {
    const b = e.target.closest('.del'); if (!b) return;
    state.events.splice(+b.dataset.i, 1); save(); render();
  });

  // sheets
  let openedAt = 0;
  function open(id) { openedAt = Date.now(); $(id).classList.add('open'); }
  function close() { document.querySelectorAll('.sheet-bg').forEach(s => s.classList.remove('open')); }
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  // 用 pointerdown 開的表單，同一下點擊的 click 會落在背景上，開啟後 500ms 內不當作點背景關閉
  document.querySelectorAll('.sheet-bg').forEach(s => s.addEventListener('click', e => { if (e.target === s && Date.now() - openedAt > 500) close(); }));

  // 新組
  const chip = (n, untimed) => `<button class="btn chip${untimed ? ' untimed' : ''}" data-n="${n}" data-untimed="${untimed ? 1 : ''}">${n}</button>`;
  $('setChips').innerHTML = '<h3>計時：壓每次過線</h3>' + TIMED_SETS.map(n => chip(n, false)).join('') +
    '<h3>不計時：只記開始與結束</h3>' + UNTIMED_SETS.map(n => chip(n, true)).join('');
  function openSet() {
    if (currentSet() && currentStart()) { toast('先按「結束」'); return; }
    $('setCustom').value = ''; $('setCustomUntimed').checked = false; open('setSheet');
  }
  function chooseSet(name, untimed) {
    if (!name) return;
    state.pending = { text: name, timed: !untimed }; save(); render();
    close(); vib(30);
  }
  $('setBtn').addEventListener('click', openSet);
  $('setChips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) chooseSet(b.dataset.n, Boolean(b.dataset.untimed)); });
  $('setCustomOk').addEventListener('click', () => chooseSet($('setCustom').value.trim(), $('setCustomUntimed').checked));

  // 異常：先記時間，再補種類
  $('abn').addEventListener('pointerdown', e => {
    e.preventDefault();
    push({ type: '異常' }); vib([30, 60, 30]);
    $('abnCustom').value = ''; open('abnSheet');
  });
  function tagAbn(text) {
    if (!text) return;
    const last = state.events[state.events.length - 1];
    if (last && last.type === '異常') { last.text = text; save(); render(); }
    close(); toast(`異常：${text}`);
  }
  $('abnChips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) tagAbn(b.dataset.n); });
  $('abnCustomOk').addEventListener('click', () => tagAbn($('abnCustom').value.trim()));

  // 備註：時間取打開當下
  let noteAt = 0;
  $('note').addEventListener('click', () => { noteAt = Date.now(); $('noteText').value = ''; open('noteSheet'); setTimeout(() => $('noteText').focus(), 50); });
  $('noteOk').addEventListener('click', () => {
    const txt = $('noteText').value.trim(); if (!txt) return close();
    push({ t: noteAt, type: 'note', text: txt }); close();
  });

  // 收操
  $('tired').addEventListener('input', e => $('tiredVal').textContent = e.target.value);
  $('finish').addEventListener('click', () => { $('pain').value = ''; $('wheeze').value = ''; open('finishSheet'); });
  $('finishOk').addEventListener('click', () => {
    if (currentSet()) push({ type: 'set_end' });
    push({ type: 'finish', tired: +$('tired').value, pain: $('pain').value.trim(), wheeze: $('wheeze').value.trim() });
    close(); toast('收操已記');
  });

  // 匯出
  function payload() {
    return {
      app: 'rink-log', version: 1,
      exported: new Date().toISOString(),
      athlete: state.athlete,
      tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
      events: state.events.map(e => ({ ...e, iso: new Date(e.t).toISOString() })),
    };
  }
  function fname(ext) {
    const d = new Date(); const day = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
    return `rink-${day}-${state.athlete || 'x'}.${ext}`;
  }
  function csv() {
    const head = 'iso,epoch_ms,athlete,set,type,lap,text\n';
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    return head + state.events.map(e => [new Date(e.t).toISOString(), e.t, state.athlete, e.set, e.type, e.lap,
      e.text || (e.type === 'finish' ? `累${e.tired} 痛:${e.pain} 喘:${e.wheeze}` : '')].map(q).join(',')).join('\n');
  }
  function download(name, text, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  $('athlete').addEventListener('input', e => { state.athlete = e.target.value.trim(); save(); $('outText').value = JSON.stringify(payload()); });
  $('export').addEventListener('click', () => { $('athlete').value = state.athlete || ''; $('outText').value = JSON.stringify(payload()); open('exportSheet'); });
  $('copyBtn').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText($('outText').value); toast('已複製'); }
    catch (e) { $('outText').select(); document.execCommand('copy'); toast('已複製'); }
  });
  $('csvBtn').addEventListener('click', () => download(fname('csv'), '﻿' + csv(), 'text/csv'));
  $('shareBtn').addEventListener('click', async () => {
    const text = JSON.stringify(payload(), null, 1);
    const file = new File([text], fname('json'), { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: fname('json') }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    download(fname('json'), text, 'application/json');
  });
  $('clearBtn').addEventListener('click', () => {
    if (!confirm('確定清除全部紀錄？請先確認已匯出。')) return;
    state.events = []; save(); render(); close(); toast('已清除');
  });

  // 螢幕常亮
  let wake = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator && !wake) wake = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wake = null; keepAwake(); } });
  document.addEventListener('pointerdown', keepAwake, { once: true });

  render(); tick();
})();
</script>
</body>
</html>
